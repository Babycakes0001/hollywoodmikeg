<style>
  :root { --bg:#08080a; --bone:#f5f0e8; --bone-soft:#c8c1b4; --bone-dim:#8a8478; --crimson:#e84858; --line:#1f1f27; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--bone); }
  body { min-height:100vh; display:flex; flex-direction:column; font-family:"Inter", sans-serif;

  header { display:flex; align-items:center; padding:22px 52px; border-bottom:1px solid var(--line); }
  header a { font-family:"Big Shoulders Display","Arial Black",sans-serif; font-weight:900; font-size:30px; color:var(--bone); text-decoration:none; letter-spacing:.01em; }
  header a span, .big span { color:var(--crimson); }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:48px 52px; max-width:900px; box-sizing:border-box; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; color:var(--crimson); }
  .big { font-family:"Big Shoulders Display","Arial Black",sans-serif; font-weight:900; font-size:clamp(96px,20vw,200px); line-height:.9; margin:18px 0 0; text-transform:uppercase; }
  .big span { text-shadow:0 0 30px rgba(232,72,88,.55); }
  .tag { font-family:"Cormorant Garamond", serif; font-style:italic; font-size:clamp(24px,3.4vw,32px); color:var(--bone-soft); margin:16px 0 0; }
  p { font-size:16px; line-height:1.7; color:var(--bone-dim); margin:18px 0 0; max-width:48ch; }
  .btn { align-self:flex-start; margin-top:30px; font-size:12px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; color:var(--bone); text-decoration:none; border:1px solid var(--crimson); padding:15px 24px; }
  .btn:hover, .btn:focus-visible { background:var(--crimson); outline:none; }
  @media (max-width:600px) { header, main { padding-left:22px; padding-right:22px; } }
</style>
